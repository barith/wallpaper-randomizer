name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest --cov=wallpaper_randomizer --cov-report=term-missing

  live-integration:
    # Runs only when REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET are configured as
    # repository secrets. Exercises the real end-to-end fetch+download path
    # (headless: never applies a wallpaper).
    name: Live integration (Reddit API)
    runs-on: ubuntu-latest
    steps:
      - name: Check for API credentials
        id: check
        run: |
          if [ -z "$REDDIT_CLIENT_ID" ] || [ -z "$REDDIT_CLIENT_SECRET" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

      - name: Checkout code
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run live integration test
        if: ${{ steps.check.outputs.skip != 'true' }}
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          python -m pytest tests/test_integration_live.py -v
